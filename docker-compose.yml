version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: file-processor-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/uploads/output
    volumes:
      - upload-data:/app/uploads
    networks:
      - file-processor-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/files/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: file-processor-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - file-processor-network
    environment:
      - API_URL=http://backend:8080/api

volumes:
  upload-data:
    driver: local

networks:
  file-processor-network:
    driver: bridge
